[package]
name = "queuecat-native-helper"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "queuecat-native-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_IO", "Win32_System_JobObjects", "Win32_Storage_FileSystem"] }

